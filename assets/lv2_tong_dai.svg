<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="100%" height="100%">
  <defs>
    <linearGradient id="tdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#071933" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tdDesk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#091220"/>
    </linearGradient>
    <linearGradient id="tdSuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f2b5c"/>
    </linearGradient>
    <linearGradient id="tdSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="tdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <ellipse cx="160" cy="200" rx="140" ry="170" fill="url(#tdBg)"/>

  <!-- Call Center Monitor Screen in background -->
  <g transform="translate(180, 110)">
    <rect x="0" y="0" width="115" height="85" rx="6" fill="#0b172a" stroke="#38bdf8" stroke-width="2" filter="url(#tdGlow)"/>
    <rect x="5" y="5" width="105" height="75" rx="3" fill="#040d1a"/>
    <!-- Fake graphs & data -->
    <rect x="10" y="10" width="95" height="12" rx="2" fill="#0284c7" opacity="0.8"/>
    <text x="14" y="19" font-family="Arial, sans-serif" font-size="7" font-weight="900" fill="#ffffff">VIETBANK VOIP SYSTEM</text>
    <rect x="10" y="28" width="50" height="6" rx="1" fill="#38bdf8" opacity="0.6"/>
    <rect x="10" y="38" width="40" height="6" rx="1" fill="#22c55e" opacity="0.6"/>
    <rect x="10" y="48" width="60" height="6" rx="1" fill="#f59e0b" opacity="0.6"/>
    <!-- Audio wave graph -->
    <path d="M68 62 L73 45 L78 68 L83 38 L88 65 L93 50 L98 62" fill="none" stroke="#38bdf8" stroke-width="1.8"/>
    <!-- Stand -->
    <rect x="48" y="85" width="20" height="18" fill="#1e293b"/>
    <rect x="35" y="103" width="46" height="6" rx="2" fill="#334155"/>
  </g>

  <!-- Sound Waves Emitting Left -->
  <g transform="translate(45, 115)">
    <path d="M0 0 Q-18 20 0 40" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M-8 -6 Q-32 20 -8 46" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M-16 -12 Q-46 20 -16 52" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Desk Surface -->
  <path d="M10 330 L310 330 L310 430 L10 430 Z" fill="url(#tdDesk)" stroke="#38bdf8" stroke-width="1.5"/>
  <rect x="10" y="328" width="300" height="4" fill="#38bdf8" opacity="0.7"/>

  <!-- Desk VoIP Phone Equipment -->
  <g transform="translate(25, 305)">
    <polygon points="0,35 65,35 55,5 10,5" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <rect x="15" y="10" width="30" height="14" rx="2" fill="#0284c7" opacity="0.7"/>
    <circle cx="20" cy="28" r="2" fill="#22c55e"/>
    <circle cx="28" cy="28" r="2" fill="#ef4444"/>
    <circle cx="36" cy="28" r="2" fill="#f59e0b"/>
    <!-- Handset cord coiled -->
    <path d="M55 20 Q65 15 62 30 Q58 45 68 40" fill="none" stroke="#64748b" stroke-width="2.5"/>
  </g>

  <!-- Body / Torso (Operator in Corporate Suit) -->
  <path d="M75 270 L75 350 L225 350 L225 270 C225 215 195 195 150 195 C105 195 75 215 75 270 Z" fill="url(#tdSuit)" stroke="#60a5fa" stroke-width="2"/>

  <!-- White Shirt & Red Tie -->
  <polygon points="150,195 125,245 175,245" fill="#f8fafc"/>
  <polygon points="145,200 155,200 158,260 150,278 142,260" fill="#dc2626"/>

  <!-- Fake VietBank Employee Lanyard Badge -->
  <line x1="135" y1="205" x2="130" y2="280" stroke="#0284c7" stroke-width="3"/>
  <line x1="165" y1="205" x2="130" y2="280" stroke="#0284c7" stroke-width="3"/>
  <rect x="110" y="275" width="45" height="30" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="2" filter="url(#tdGlow)"/>
  <rect x="114" y="278" width="37" height="7" fill="#0284c7"/>
  <rect x="116" y="289" width="16" height="11" rx="1" fill="#94a3b8"/>
  <line x1="136" y1="291" x2="147" y2="291" stroke="#475569" stroke-width="2"/>
  <line x1="136" y1="296" x2="145" y2="296" stroke="#475569" stroke-width="1.5"/>

  <!-- Neck -->
  <rect x="136" y="160" width="28" height="40" fill="#f59e0b" rx="4"/>

  <!-- Head / Face -->
  <ellipse cx="150" cy="125" rx="38" ry="46" fill="url(#tdSkin)" filter="url(#tdGlow)"/>

  <!-- Styled Black Hair -->
  <path d="M112 115 C108 70 130 55 155 55 C185 55 196 75 190 115 C184 95 172 88 150 88 C130 88 118 98 112 115 Z" fill="#0f172a"/>

  <!-- Sharp Eyebrows -->
  <path d="M125 105 Q135 100 144 104" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <path d="M156 104 Q165 100 175 105" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

  <!-- Eyes with Focused Expression -->
  <ellipse cx="135" cy="114" rx="4.5" ry="3.5" fill="#0f172a"/>
  <circle cx="136.5" cy="113" r="1.5" fill="#ffffff"/>
  <ellipse cx="165" cy="114" rx="4.5" ry="3.5" fill="#0f172a"/>
  <circle cx="166.5" cy="113" r="1.5" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M150 115 L147 130 L153 130" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>

  <!-- Confident Persuasive Mouth -->
  <path d="M138 145 Q150 153 164 146" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Call Center Headset with Mic -->
  <path d="M112 125 C108 85 130 70 150 70 C172 70 190 85 188 125" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <rect x="107" y="116" width="9" height="22" rx="3" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="184" y="116" width="9" height="22" rx="3" fill="#0284c7" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M112 130 Q115 160 136 160" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <circle cx="138" cy="160" r="5" fill="#ef4444"/>

  <!-- Left Arm Holding Phone to Ear -->
  <path d="M78 270 C60 230 50 180 80 135" fill="none" stroke="#1d4ed8" stroke-width="26" stroke-linecap="round"/>
  
  <!-- Smartphone in Hand (at ear) -->
  <rect x="66" y="95" width="26" height="52" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" transform="rotate(-15 79 121)" filter="url(#tdGlow)"/>
  <rect x="70" y="100" width="18" height="42" rx="3" fill="#0284c7" opacity="0.75" transform="rotate(-15 79 121)"/>
  <!-- Hand gripping phone -->
  <ellipse cx="84" cy="132" rx="7" ry="5.5" fill="#f59e0b" transform="rotate(-15 84 132)"/>
  <ellipse cx="86" cy="122" rx="7" ry="5.5" fill="#f59e0b" transform="rotate(-15 86 122)"/>

  <!-- Bottom Title Tag -->
  <g transform="translate(25, 395)">
    <rect x="0" y="0" width="270" height="34" rx="17" fill="#031024" stroke="#38bdf8" stroke-width="2" filter="url(#tdGlow)"/>
    <circle cx="18" cy="17" r="7" fill="#ef4444"/>
    <text x="34" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="900" fill="#ffffff" letter-spacing="0.5">TỔNG ĐÀI VIETBANK (+024)</text>
    <text x="238" y="23" font-family="Arial, sans-serif" font-size="14">🎧</text>
  </g>
</svg>
